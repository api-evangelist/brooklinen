note: >-
  Brooklinen does not use RFC 9457 problem+json. Two error models are in play: JSON-RPC 2.0 error objects on
  the UCP/MCP endpoint (with a UCP-specific `data` payload), and bare HTTP status codes on the read-only
  storefront JSON surface. Entries below are either observed live on 2026-08-02 or read from the UCP shopping
  error schema Brooklinen's own discovery profile references. No error registry is published by Brooklinen.
