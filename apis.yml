apis:
- name: Brooklinen UCP / MCP Agentic Commerce API
  description: >-
    Live Universal Commerce Protocol (UCP) endpoint exposed over MCP JSON-RPC at
    https://www.brooklinen.com/api/ucp/mcp, advertised by the store's own /agents.md, /robots.txt and
    /.well-known/ucp discovery profile. Provides agent-driven catalog search and lookup, cart management,
    checkout creation/update/completion and order retrieval against the Brooklinen storefront. Requires a
    resolvable UCP agent profile (meta.ucp-agent.profile / UCP-Agent header) — anonymous tools/list returns
    JSON-RPC error -32001 invalid_profile_url. Payment completion requires explicit human buyer approval.
  humanURL: https://www.brooklinen.com/agents.md
  baseURL: https://www.brooklinen.com/api/ucp/mcp
  tags:
  - agentic-commerce
  - universal-commerce-protocol
  - mcp
  - agent-native
  - checkout
  - catalog
  properties:
  - type: MCPServer
    url: mcp/brooklinen-mcp.yml
  - type: MCP
    url: https://www.brooklinen.com/api/ucp/mcp
  - type: ToolCrosswalk
    url: mcp/brooklinen-tool-crosswalk.yml
  - type: Documentation
    url: https://www.brooklinen.com/agents.md
  - type: WellKnown
    url: well-known/brooklinen-ucp.json
  - type: Authentication
    url: authentication/brooklinen-authentication.yml
  - type: OAuthScopes
    url: scopes/brooklinen-scopes.yml
  - type: Idempotency
    url: conventions/brooklinen-conventions.yml
  - type: ErrorCatalog
    url: errors/brooklinen-problem-types.yml
- name: Brooklinen Shopify Storefront JSON API
  description: >-
    Read-only, unauthenticated JSON endpoints over the Brooklinen Shopify storefront, documented by the store
    itself in /agents.md for agents that only need to read store data without transacting. Covers the full
    product list, per-product detail, per-collection product lists, predictive search suggestions and the
    session cart. Every operation captured here was probed live and returned HTTP 200.
  humanURL: https://www.brooklinen.com/agents.md
  baseURL: https://www.brooklinen.com/
  tags:
  - ecommerce
  - catalog
  - shopify
  - retail
  - product-data
