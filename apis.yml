aid: brooklinen
name: Brooklinen
description: >-
  Brooklinen is a direct-to-consumer home essentials brand founded in Brooklyn, New York in 2014 by Rich and
  Vicki Fulop, selling sheets, duvet covers, comforters, pillows, towels, robes and loungewear direct from the
  mill to the customer. Brooklinen publishes no traditional developer API program, but its storefront runs on
  Shopify and exposes a substantial machine-readable agent surface: an agent instruction document at
  /agents.md (mirrored at /llms.txt), a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp declaring protocol versions 2026-04-08 and 2026-01-23, a live UCP/MCP JSON-RPC endpoint at
  /api/ucp/mcp for agent-driven catalog search, cart, checkout and order operations, OAuth 2.0 / OIDC
  customer-account authorization metadata at /.well-known/oauth-authorization-server and
  /.well-known/oauth-protected-resource, and the read-only Shopify storefront JSON endpoints for products,
  collections, search suggestions and cart. Checkout explicitly requires contemporaneous human buyer approval.
